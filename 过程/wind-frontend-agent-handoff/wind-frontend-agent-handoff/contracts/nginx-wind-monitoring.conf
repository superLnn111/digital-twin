# Include INSIDE the existing HTTPS server block. Do not replace its old routes.
# Keep the camera's inherited Basic Auth, unlike the public static UI below.
location = /v2-ui/live.mjpeg {
    proxy_pass http://127.0.0.1:18082/live.mjpeg;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}

location = /v2-ui {
    auth_basic off;
    return 301 /v2-ui/;
}
location ^~ /v2-ui/ {
    auth_basic off;
    alias /var/www/wind-v2-ui/;
    index index.html;
    try_files $uri $uri/ /v2-ui/index.html;
}

location /wind-v2/ {
    # This new API verifies Bearer tokens itself; old site authentication is unchanged.
    auth_basic off;
    proxy_pass http://127.0.0.1:8101/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_buffering off;
    client_max_body_size 8m;
}
